plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.2'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'cn.edu.bistu.cs.projectmaterialmanagement'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'com.mysql:mysql-connector-j'


    implementation 'com.highgo:hgdb-pgjdbc:42.5.0'

    implementation group: 'com.alibaba', name: 'druid', version: '1.2.5'

//    implementation group: 'org.postgresql', name: 'postgresql'

    // https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-aop
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-aop', version: '3.3.2'


    // https://mvnrepository.com/artifact/org.springframework.security/spring-security-rsa
    implementation group: 'org.springframework.security', name: 'spring-security-rsa', version: '1.1.3'


    // https://mvnrepository.com/artifact/com.auth0/java-jwt
    implementation group: 'com.auth0', name: 'java-jwt', version: '4.4.0'


    // https://mvnrepository.com/artifact/org.projectlombok/lombok
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.30'


    // https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.11.0'

    // https://mvnrepository.com/artifact/pro.fessional/kaptcha
    implementation group: 'pro.fessional', name: 'kaptcha', version: '2.3.3'


    // https://mvnrepository.com/artifact/org.apache.poi/poi
    implementation group: 'org.apache.poi', name: 'poi', version: '5.3.0'

    // https://mvnrepository.com/artifact/org.apache.poi/poi-ooxml
    implementation group: 'org.apache.poi', name: 'poi-ooxml', version: '5.3.0'

    //camunda
    // https://mvnrepository.com/artifact/org.camunda.spin/camunda-spin-dataformat-all
    implementation group: 'org.camunda.spin', name: 'camunda-spin-dataformat-all', version: '1.23.0'

    // https://mvnrepository.com/artifact/org.camunda.bpm/camunda-engine-plugin-spin
    implementation group: 'org.camunda.bpm', name: 'camunda-engine-plugin-spin', version: '7.21.0'

    // https://mvnrepository.com/artifact/org.camunda.bpm.springboot/camunda-bpm-spring-boot-starter-webapp
    implementation group: 'org.camunda.bpm.springboot', name: 'camunda-bpm-spring-boot-starter-webapp', version: '7.21.0'

    // https://mvnrepository.com/artifact/org.camunda.bpm.springboot/camunda-bpm-spring-boot-starter-rest
    implementation group: 'org.camunda.bpm.springboot', name: 'camunda-bpm-spring-boot-starter-rest', version: '7.21.0'

    // https://mvnrepository.com/artifact/org.camunda.bpm/camunda-bom
    testImplementation group: 'org.camunda.bpm', name: 'camunda-bom', version: '7.21.0', ext: 'pom'


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
